# Benchmark Config — Qwen2.5-Coder 3B (GGUF, Local)
# Usage: python scripts/run_benchmark.py --config benchmark/configs/local_llm_qwen25_coder_3b.yaml

config_id: "local_llm_qwen25_coder_3b"
config_version: "1.0"
created_at: "2026-05-11"

# ─── Model ───────────────────────────────────────────────────────────────────
model:
  model_name: "Qwen2.5-Coder-3B-Instruct"
  model_family: "qwen2.5-coder"
  model_path: "models/qwen2.5-coder-3b-instruct-q4_k_m.gguf"   # relative to project root
  size_b: 3
  quantization: "Q4_K_M"
  context_length: 8192
  recommended_n_gpu_layers: 35       # adjust per GPU VRAM
  ram_estimate_gb: 2.5
  edge_profile: false                # true = mobile/tablet target
  sql_capability_tag: "medium"       # low / medium / high
  persian_capability_tag: "low"      # low / medium / high

# ─── Inference ────────────────────────────────────────────────────────────────
inference:
  n_ctx: 4096
  temperature: 0.1
  top_p: 0.9
  top_k: 40
  max_tokens: 512
  repeat_penalty: 1.1
  seed: 42

# ─── Prompt ───────────────────────────────────────────────────────────────────
prompt:
  template_id: "sql_generation_v1"
  template_file: "src/generation/prompts/sql_generation_v1.j2"
  output_format: "json"              # json | plain_sql

# ─── Dataset ──────────────────────────────────────────────────────────────────
dataset:
  source: "data/questions/full/vtd_question_sql_400_merged_validated.json"
  sample_size: 50                    # null = full dataset
  split: "dev"                       # train / dev / test / full
  difficulty_filter: null            # null | easy | medium | hard
  category_filter: null

# ─── Pipeline Features ────────────────────────────────────────────────────────
features:
  enable_persian_normalization: true
  enable_nlu: true
  enable_schema_linking: true
  enable_value_linking: true
  enable_cag: false
  enable_rag: false
  enable_reflexion: false
  enable_validation: true
  enable_sql_rewriter: true
  enable_reliability_gate: false
  max_retries: 1

# ─── Output ───────────────────────────────────────────────────────────────────
output:
  results_dir: "results/benchmark"
  save_predictions: true
  save_failures: true
  save_prompt_samples: true          # save first 10 full prompts for inspection
