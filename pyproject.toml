[project]
name = "adhd-vtd"
version = "0.1.0"
description = "Persian-aware reflexive Text-to-SQL system for mental health data"
requires-python = ">=3.12,<3.13"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "Windows"
extraPaths = ["."]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# CLI scripts bootstrap project-root imports before importing src modules.
"scripts/*.py" = ["E402"]
